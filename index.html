<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ea6a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Livreur DHD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:#f4f4f4;color:#222;padding-bottom:90px}
header{background:#ea6a0a;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;margin:0}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
nav{display:flex;background:#fff;position:sticky;top:52px;z-index:4;box-shadow:0 1px 3px #0002}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:13px;color:#555;border-bottom:3px solid transparent}
nav button.on{color:#ea6a0a;border-color:#ea6a0a;font-weight:700}
main{padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.card h3{margin:0 0 2px;font-size:17px}
.muted{color:#777;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:8px;padding:10px 12px;font-size:15px;color:#fff;text-decoration:none;display:inline-block;text-align:center}
.g{background:#43a047}.r{background:#e53935}.b{background:#00acc1}.o{background:#fb8c00}.p{background:#5e35b1}.gr{background:#9e9e9e}.w{background:#25d366}
.big{flex:1}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;color:#fff;margin-left:4px}
.warn{background:#fff3e0;border-left:4px solid #fb8c00;padding:10px;border-radius:8px;margin-bottom:10px}
.dead{background:#ffebee;border-left:4px solid #e53935}
.fab{position:fixed;right:16px;bottom:18px;background:#ea6a0a;color:#fff;border:0;border-radius:30px;padding:14px 20px;font-size:17px;box-shadow:0 3px 8px #0004;z-index:6}
dialog{border:0;border-radius:14px;padding:16px;width:92%;max-width:420px}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 10px;font-size:18px}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.rs{display:block;width:100%;margin:6px 0;background:#00bcd4}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}
.kv b{font-size:18px}
#map{height:52vh;border-radius:12px;margin-bottom:8px;background:#ddd}
.num{background:#ea6a0a;color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;line-height:24px;text-align:center;font-weight:700;box-shadow:0 1px 4px #0006}
.hist{color:#c62828;font-size:13px;font-weight:600}
</style>
</head>
<body>
<header><h1>📦 Livreur DHD</h1><button id="menuBtn">⚙️ Options</button></header>
<nav id="tabs">
<button data-t="encours" class="on">En cours</button>
<button data-t="echoue">Échoués</button>
<button data-t="livre">Livrés</button>
<button data-t="carte">🗺 Carte</button>
<button data-t="resume">Résumé</button>
</nav>
<main id="view"></main>
<button class="fab" id="addBtn">＋ Colis</button>

<dialog id="dAdd"><form method="dialog" id="fAdd">
<h2>Nouveau colis</h2>
<input name="tracking" placeholder="Tracking (DHD...)" required>
<input name="nom" placeholder="Destinataire" required>
<input name="wilaya" placeholder="Wilaya" value="Batna">
<input name="commune" placeholder="Commune (Barika...)" required>
<input name="tel" type="tel" inputmode="tel" placeholder="Téléphone 06...">
<input name="montant" type="number" inputmode="numeric" placeholder="Prix total (DA)" required>
<input name="remarque" placeholder="Remarque / adresse">
<div class="row"><button class="btn g big" value="ok">Enregistrer</button><button class="btn gr" value="x" formnovalidate>Annuler</button></div>
<div class="row"><button type="button" class="btn p big" id="bulkBtn">📋 Plusieurs colis d'un coup</button></div>
</form></dialog>

<dialog id="dBulk"><h2>Coller plusieurs colis</h2>
<div class="muted">سطر لكل colis، والترتيب:<br><b>tracking ; nom ; commune ; téléphone ; montant ; remarque</b><br>تقدر تنسخ من Excel أو Google Sheets مباشرة.</div>
<textarea id="bulkTxt" rows="8" placeholder="DHDT6ZK26110121445068;Fawaz;Barika;0652324195;2850;trio horizon 28/40"></textarea>
<div class="row"><button class="btn g big" id="bulkOk">Ajouter</button><button class="btn gr" id="bulkX">Annuler</button></div></dialog>

<dialog id="dFail"><h2>Raison de l'échec ?</h2><div id="reasons"></div><button class="btn gr" style="width:100%" id="failCancel">Annuler</button></dialog>

<dialog id="dMenu"><h2>Options</h2>
<label class="muted">Ma commission par colis (DA)</label>
<input id="com" type="number" inputmode="numeric">
<label class="muted">Lien Google Sheet (Apps Script) — اختياري</label>
<input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
<div class="row">
<button class="btn p big" id="syncBtn">📤 Envoyer vers Google Sheet</button>
<button class="btn b big" id="csvBtn">⬇️ Export CSV</button>
<button class="btn o big" id="notifBtn">🔔 Activer les rappels</button>
<button class="btn r big" id="wipeBtn">🗑 Tout effacer</button>
<button class="btn g big" id="saveOpt">OK</button>
</div></dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='livreur_dhd_v1';
const REASONS=["Client ne répond pas","Client injoignable","Reporté par le client","Annulé par le client","Numéro erroné ou incorrecte","RDV fixé CNRP","Non abouti","Client non sérieux","Appel rejeté","RDV fixé avec le client","Autre (écrire commentaire)"];
const NORETRY=["Annulé par le client","Numéro erroné ou incorrecte"];
const MAXDAYS=3;
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{colis:[],commission:0,sheetUrl:''};
let tab='encours',failId=null;
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const days=s=>Math.round((new Date(iso()+'T00:00:00')-new Date(s+'T00:00:00'))/864e5);
const intl=t=>{t=String(t||'').replace(/\D/g,'');return t.startsWith('0')?'213'+t.slice(1):t};
const da=n=>Number(n||0).toLocaleString('fr-FR')+' DA';

function expired(c){return c.statut==='echoue'&&c.firstFail&&days(c.firstFail)>=MAXDAYS}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(map){map.remove();map=null}const v=$('#view');let h='';
  const list=S.colis;
  if(tab==='encours'){
    const items=list.filter(c=>c.statut==='encours');
    const retry=list.filter(c=>c.statut==='echoue'&&!expired(c));
    if(retry.length)h+=`<div class="warn">🔁 <b>${retry.length}</b> colis échoués à relancer (max ${MAXDAYS} jours) — voir onglet Échoués</div>`;
    // group by commune
    const by={};items.forEach(c=>(by[c.commune||'?']=by[c.commune||'?']||[]).push(c));
    Object.keys(by).sort().forEach(k=>{h+=`<div class="muted" style="margin:8px 4px">📍 ${esc(k)} (${by[k].length})</div>`+by[k].map(card).join('')});
    if(!items.length)h+='<p class="muted" style="text-align:center;margin-top:40px">Aucun colis en cours.<br>اضغط ＋ Colis باش تزيد</p>';
  }else if(tab==='echoue'){
    const dead=list.filter(expired);
    if(dead.length)h+=`<div class="warn dead">🗑 <b>${dead.length}</b> colis dépassent ${MAXDAYS} jours.<div class="row"><button class="btn r" data-a="purge">Supprimer</button></div></div>`;
    const items=list.filter(c=>(c.statut==='echoue'||c.statut==='retour'));
    items.sort((a,b)=>(b.firstFail||'').localeCompare(a.firstFail||'')).reverse();
    h+=items.map(card).join('')||'<p class="muted" style="text-align:center;margin-top:40px">Aucun échec ✅</p>';
  }else if(tab==='livre'){
    const items=list.filter(c=>c.statut==='livre');
    h+=items.map(card).join('')||'<p class="muted" style="text-align:center;margin-top:40px">Aucun colis livré.</p>';
  }else if(tab==='carte'){
    h+=mapHtml();
  }else{
    const n=s=>list.filter(c=>c.statut===s);
    const sum=a=>a.reduce((t,c)=>t+Number(c.montant||0),0);
    const rc={};list.forEach(c=>(c.echecs||[]).forEach(e=>rc[e.raison]=(rc[e.raison]||0)+1));
    const gains=n('livre').length*Number(S.commission||0);
    h+=`<div class="card">
    <div class="kv"><span>En cours</span><b>${n('encours').length}</b></div>
    <div class="kv"><span>Livrés</span><b>${n('livre').length}</b></div>
    <div class="kv"><span>Échoués</span><b>${n('echoue').length}</b></div>
    <div class="kv"><span>À retourner</span><b>${n('retour').length}</b></div>
    <div class="kv"><span>💰 Cash à remettre à DHD</span><b>${da(sum(n('livre')))}</b></div>
    <div class="kv"><span>Cash en attente</span><b>${da(sum(n('encours')))}</b></div>
    <div class="kv"><span>Mes gains (commission ${S.commission||0})</span><b>${da(gains)}</b></div></div>
    <div class="card"><b>Échecs par raison</b>${Object.keys(rc).map(k=>`<div class="kv"><span>${esc(k)}</span><b>${rc[k]}</b></div>`).join('')||'<p class="muted">—</p>'}</div>`;
  }
  v.innerHTML=h;
  if(tab==='carte')initMap();
}
function card(c){
  let tag='';
  if(c.statut==='echoue'){const d=c.firstFail?days(c.firstFail):0;tag=expired(c)?'<span class="tag" style="background:#757575">à supprimer</span>':`<span class="tag" style="background:#e53935">échec ${d}/${MAXDAYS} j</span>`}
  if(c.statut==='retour')tag='<span class="tag" style="background:#5e35b1">à retourner</span>';
  if(c.statut==='livre')tag='<span class="tag" style="background:#43a047">livré</span>';
  const last=(c.echecs||[]).slice(-1)[0];
  const nf=c.tel?S.colis.filter(x=>x.id!==c.id&&x.tel===c.tel&&(x.echecs||[]).length).length:0;
  const hist=nf?`<div class="hist">⚠ نفس الرقم: ${nf} colis فشلوا من قبل</div>`:'';
  const tel=esc(c.tel);const q=encodeURIComponent((c.commune||'')+' '+(c.wilaya||'')+' Algérie');
  let acts='';
  if(c.statut==='encours'){acts=`<button class="btn r big" data-a="fail" data-id="${c.id}">Échouée</button><button class="btn g big" data-a="ok" data-id="${c.id}">Livré ✔</button>`}
  else if(c.statut==='echoue'){acts=`<button class="btn o big" data-a="retry" data-id="${c.id}">Remettre en cours</button><button class="btn g big" data-a="ok" data-id="${c.id}">Livré ✔</button>`}
  else if(c.statut==='retour'){acts=`<button class="btn gr big" data-a="del" data-id="${c.id}">Retourné (supprimer)</button>`}
  else{acts=`<button class="btn gr big" data-a="undo" data-id="${c.id}">Annuler livraison</button>`}
  return `<div class="card"><h3>${esc(c.nom)} ${tag}</h3>
  <div class="muted">${esc(c.commune)}${c.remarque?' — '+esc(c.remarque):''}</div>
  <div class="muted">${esc(c.tracking)}</div>
  ${hist}
  <div style="margin-top:4px"><b>${da(c.montant)}</b></div>
  ${last?`<div class="muted">Dernier échec: ${esc(last.raison)} (${esc(last.date)})</div>`:''}
  <div class="row">
  ${tel?`<a class="btn b" href="tel:${tel}">📞</a><a class="btn b" href="sms:${tel}">💬</a><a class="btn w" href="https://wa.me/${intl(tel)}">WA</a>`:''}
  <a class="btn p" href="https://www.google.com/maps/search/?api=1&query=${c.lat!=null?c.lat+','+c.lng:q}">📍</a><button class="btn gr" data-a="place" data-id="${c.id}">📌 ${c.lat!=null?'✔':''}</button></div>
  <div class="row">${acts}</div></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');if(t&&t.closest('#tabs')){tab=t.dataset.t;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const c=S.colis.find(x=>x.id===b.dataset.id);const a=b.dataset.a;
  if(a==='ok'&&c){c.statut='livre';c.dateLivre=iso()}
  else if(a==='retry'&&c){c.statut='encours'}
  else if(a==='undo'&&c){c.statut='encours'}
  else if(a==='del'&&c){if(!confirm('Supprimer ce colis ?'))return;S.colis=S.colis.filter(x=>x.id!==c.id)}
  else if(a==='purge'){const n=S.colis.filter(expired).length;if(!confirm('Supprimer '+n+' colis expirés ?'))return;S.colis=S.colis.filter(x=>!expired(x))}
  else if(a==='place'&&c){placingId=c.id;tab='carte';render();window.scrollTo(0,0);return}
  else if(a==='cancelplace'){placingId=null;render();return}
  else if(a==='geo'&&c){b.disabled=true;b.textContent='…';geocode(c);return}
  else if(a==='start'){getStart();return}
  else if(a==='gmaps'){gmaps();return}
  else if(a==='fail'&&c){failId=c.id;$('#dFail').showModal();return}
  save();render();
});
$('#reasons').innerHTML=REASONS.map(r=>`<button class="btn rs" data-r="${esc(r)}">${esc(r)}</button>`).join('');
$('#reasons').addEventListener('click',e=>{
  const b=e.target.closest('[data-r]');if(!b)return;
  let r=b.dataset.r;
  if(r.startsWith('Autre')){const x=prompt('Commentaire / تعليق');if(!x)return;r=x}
  const c=S.colis.find(x=>x.id===failId);if(!c)return;
  c.echecs=c.echecs||[];c.echecs.push({date:iso(),raison:r});
  c.firstFail=c.firstFail||iso();
  c.statut=NORETRY.includes(r)?'retour':'echoue';
  $('#dFail').close();save();render();
});
$('#failCancel').onclick=()=>$('#dFail').close();
$('#addBtn').onclick=()=>$('#dAdd').showModal();
$('#fAdd').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.value!=='ok')return;
  const f=new FormData(e.target);
  S.colis.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),tracking:f.get('tracking').trim(),nom:f.get('nom').trim(),wilaya:f.get('wilaya').trim(),commune:f.get('commune').trim(),tel:f.get('tel').trim(),montant:Number(f.get('montant')),remarque:f.get('remarque').trim(),statut:'encours',echecs:[],added:iso()});
  e.target.reset();e.target.wilaya.value='Batna';save();tab='encours';render();
});
$('#bulkBtn').onclick=()=>{$('#dAdd').close();$('#bulkTxt').value='';$('#dBulk').showModal()};
$('#bulkX').onclick=()=>$('#dBulk').close();
$('#bulkOk').onclick=()=>{
  const lines=$('#bulkTxt').value.split(/\r?\n/);let ok=0,dup=0,bad=0;
  lines.forEach(l=>{
    if(!l.trim())return;
    const p=l.split(/\t|;|,/).map(x=>x.trim());
    if(p.length<5||!p[0]||isNaN(Number(p[4]))){bad++;return}
    if(S.colis.some(c=>c.tracking===p[0])){dup++;return}
    S.colis.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tracking:p[0],nom:p[1],wilaya:'Batna',commune:p[2],tel:p[3],montant:Number(p[4]),remarque:p.slice(5).join(', '),statut:'encours',echecs:[],added:iso()});
    ok++;
  });
  save();tab='encours';render();$('#dBulk').close();
  alert('Ajoutés: '+ok+(dup?'\nDéjà existants: '+dup:'')+(bad?'\nLignes invalides: '+bad:''));
};
$('#menuBtn').onclick=()=>{$('#com').value=S.commission||'';$('#sheetUrl').value=S.sheetUrl||'';$('#dMenu').showModal()};
$('#saveOpt').onclick=()=>{S.commission=Number($('#com').value||0);S.sheetUrl=$('#sheetUrl').value.trim();save();$('#dMenu').close();render()};
$('#wipeBtn').onclick=()=>{if(confirm('Effacer toutes les données ?')){S.colis=[];save();$('#dMenu').close();render()}};
$('#csvBtn').onclick=()=>{
  const H=['tracking','nom','wilaya','commune','tel','montant','statut','premier_echec','raisons','remarque'];
  const rows=S.colis.map(c=>[c.tracking,c.nom,c.wilaya,c.commune,c.tel,c.montant,c.statut,c.firstFail||'',(c.echecs||[]).map(e=>e.date+' '+e.raison).join(' | '),c.remarque]);
  const csv='﻿'+[H].concat(rows).map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='colis_'+iso()+'.csv';a.click();
};
$('#syncBtn').onclick=async()=>{
  const u=$('#sheetUrl').value.trim();if(!u){alert('Mets le lien Apps Script d\'abord');return}
  S.sheetUrl=u;save();
  try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({colis:S.colis})});alert('Envoyé ✔ — شوف Google Sheet')}catch(err){alert('Erreur: '+err.message)}
};
$('#notifBtn').onclick=async()=>{
  if(!('Notification' in window)){alert('Non supporté');return}
  const p=await Notification.requestPermission();alert(p==='granted'?'Rappels activés (ils s\'affichent quand tu ouvres l\'app)':'Refusé');
};
function remind(){
  const n=S.colis.filter(c=>c.statut==='echoue'&&!expired(c)).length;
  if(n&&'Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker){
    navigator.serviceWorker.ready.then(r=>r.showNotification('📦 Livreur DHD',{body:n+' colis échoués à relancer aujourd\'hui',icon:'icon-192.png'}));
  }
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

let map=null,placingId=null,startPos=null;
const BARIKA=[35.3889,5.3656];
function kmDist(a,b){const t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const q=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 6371*2*Math.asin(Math.sqrt(q))}
function plan(start){
  const pts=S.colis.filter(c=>c.statut==='encours'&&c.lat!=null);const out=[];let cur=start;
  while(pts.length){let bi=0,bd=1e9;pts.forEach((c,i)=>{const d=kmDist(cur,[c.lat,c.lng]);if(d<bd){bd=d;bi=i}});const c=pts.splice(bi,1)[0];out.push(c);cur=[c.lat,c.lng]}
  return out;
}
function mapHtml(){
  const planned=plan(startPos||BARIKA);
  const unplaced=S.colis.filter(c=>c.statut==='encours'&&c.lat==null);
  let h='';
  if(placingId){const c=S.colis.find(x=>x.id===placingId);h+=`<div class="warn">📌 المس الخريطة باش تحط: <b>${esc(c?c.nom:'')}</b> <button class="btn gr" data-a="cancelplace">Annuler</button></div>`}
  h+='<div id="map"></div>';
  h+='<div class="row"><button class="btn b big" data-a="start">🧭 Partir de ma position</button><button class="btn p big" data-a="gmaps">🗺 Itinéraire Google Maps</button></div>';
  h+=`<div class="card" style="margin-top:10px"><b>Ordre de passage (${planned.length})</b>`+(planned.map((c,i)=>`<div class="kv"><span>${i+1}. ${esc(c.nom)} <span class="muted">${esc(c.commune)}</span></span><button class="btn gr" data-a="place" data-id="${c.id}">📌</button></div>`).join('')||'<p class="muted">Aucun colis placé sur la carte.</p>')+'</div>';
  if(unplaced.length)h+=`<div class="card"><b>Sans position (${unplaced.length})</b>`+unplaced.map(c=>`<div class="kv"><span>${esc(c.nom)} <span class="muted">${esc(c.commune)}</span></span><span><button class="btn o" data-a="geo" data-id="${c.id}">🔎</button> <button class="btn gr" data-a="place" data-id="${c.id}">📌</button></span></div>`).join('')+'<p class="muted">🔎 بحث تلقائي (تقريبي) — 📌 دبوس يدوي (أدق)</p></div>';
  return h;
}
function initMap(){
  if(typeof L==='undefined'){$('#map').innerHTML='<p class="muted" style="padding:20px">La carte demande Internet — الخريطة تحتاج إنترنت.</p>';return}
  const st=startPos||BARIKA;
  map=L.map('map').setView(st,13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const pl=plan(st);const pts=[st];
  if(startPos)L.circleMarker(st,{radius:7,color:'#1565c0',fillOpacity:1}).addTo(map).bindTooltip('Départ');
  pl.forEach((c,i)=>{const p=[c.lat,c.lng];pts.push(p);
    L.marker(p,{icon:L.divIcon({className:'',html:'<div class="num">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map).bindPopup(esc(c.nom)+'<br>'+esc(c.tel||'')+'<br>'+da(c.montant));
  });
  if(pts.length>1){L.polyline(pts,{color:'#ea6a0a',weight:4}).addTo(map);map.fitBounds(pts,{padding:[30,30]})}
  map.on('click',ev=>{
    if(!placingId)return;
    const c=S.colis.find(x=>x.id===placingId);
    if(c){c.lat=+ev.latlng.lat.toFixed(6);c.lng=+ev.latlng.lng.toFixed(6);save()}
    placingId=null;render();
  });
}
async function geocode(c){
  const qs=[[c.remarque,c.commune,c.wilaya,'Algeria'],[c.commune,c.wilaya,'Algeria']].map(a=>a.filter(Boolean).join(', '));
  for(const q of qs){
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
      const j=await r.json();
      if(j[0]){c.lat=+(+j[0].lat).toFixed(6);c.lng=+(+j[0].lon).toFixed(6);save();render();return}
    }catch(e){}
    await new Promise(r=>setTimeout(r,1100));
  }
  alert('Adresse introuvable — استعمل 📌 باش تحط الدبوس يدويا');render();
}
function getStart(){
  if(!navigator.geolocation){alert('GPS non supporté');return}
  navigator.geolocation.getCurrentPosition(p=>{startPos=[p.coords.latitude,p.coords.longitude];render()},()=>alert('Position refusée — فعّل الموقع'),{enableHighAccuracy:true,timeout:15000});
}
function gmaps(){
  const pl=plan(startPos||BARIKA).slice(0,10);
  if(!pl.length){alert('Place des colis sur la carte d\'abord (📌)');return}
  const d=pl[pl.length-1];const w=pl.slice(0,-1).map(c=>c.lat+','+c.lng).join('|');
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+d.lat+','+d.lng;
  if(w)u+='&waypoints='+encodeURIComponent(w);
  if(startPos)u+='&origin='+startPos[0]+','+startPos[1];
  window.open(u,'_blank');
}
render();remind();
</script>
